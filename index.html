<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsii-74 AI Signal Engine - Pocket Option Market</title>
  <style>
    :root {
      --bg-main: #1f1813;
      --board-bg: #2d221a;
      --card-inner: #3a2d23;
      --border-color: #534133;
      --primary-orange: #ffa852;
      --primary-orange-hover: #ff9430;
      --orange-glow: rgba(255, 168, 82, 0.25);
      --text-main: #f8f1ea;
      --text-muted: #bdae9f;
      --buy-green: #22c55e;
      --buy-glow: rgba(34, 197, 94, 0.35);
      --sell-red: #ef4444;
      --sell-glow: rgba(239, 68, 68, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* FULL SCREEN SIGNAL ALERTS (Inside and Outside) */
    body.signal-buy-active {
      background-color: #0d2818 !important;
      box-shadow: inset 0 0 120px var(--buy-green);
    }

    body.signal-sell-active {
      background-color: #310f0f !important;
      box-shadow: inset 0 0 120px var(--sell-red);
    }

    .dashboard {
      background-color: var(--board-bg);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    body.signal-buy-active .dashboard {
      border-color: var(--buy-green);
      background-color: #123320;
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.4);
    }

    body.signal-sell-active .dashboard {
      border-color: var(--sell-red);
      background-color: #3b1616;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
    }

    /* Header & Server Badge */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .server-badge {
      background-color: rgba(255, 168, 82, 0.12);
      color: var(--primary-orange);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid var(--primary-orange);
      letter-spacing: 0.5px;
    }

    /* Controls Layout */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    /* Select Inputs with Light Orange Design */
    .custom-select {
      background-color: var(--card-inner);
      color: var(--primary-orange);
      border: 1.8px solid var(--primary-orange);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      transition: all 0.25 ease;
      width: 100%;
    }

    .custom-select:focus {
      box-shadow: 0 0 10px var(--orange-glow);
    }

    .custom-select option {
      background-color: var(--board-bg);
      color: var(--text-main);
      font-weight: 500;
    }

    /* Bigger AI Standby Signal Engine Container */
    .engine-display {
      background-color: var(--card-inner);
      border: 2px dashed var(--primary-orange);
      border-radius: 14px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 22px;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .engine-status {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary-orange);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }

    .engine-subtext {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Active Signal Visualizer */
    .signal-box {
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 22px;
      display: none;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      animation: pulseAlert 1.5s infinite alternate;
    }

    @keyframes pulseAlert {
      0% { transform: scale(0.99); }
      100% { transform: scale(1.01); }
    }

    .signal-box.buy {
      display: block;
      background-color: rgba(34, 197, 94, 0.25);
      border: 2px solid var(--buy-green);
      color: #4ade80;
    }

    .signal-box.sell {
      display: block;
      background-color: rgba(239, 68, 68, 0.25);
      border: 2px solid var(--sell-red);
      color: #fca5a5;
    }

    /* High-Professional Moderate Action Button */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--primary-orange), #f58220);
      color: #1c130b;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 18px rgba(255, 168, 82, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-orange-hover), #e07110);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 168, 82, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* Live Market Price Bar */
    .market-ticker {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .price-value {
      font-weight: 700;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <div class="brand-title">
        <span>Pocket Options AI</span>
      </div>
      <div class="server-badge">Server: Arsii-74</div>
    </div>

    <!-- Pair & Timeframe Controls -->
    <div class="controls-grid">
      <div class="control-group">
        <label for="pair-select">Select Pair</label>
        <select id="pair-select" class="custom-select">
          <optgroup label="Pocket Option OTC Pairs">
            <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
            <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
            <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
            <option value="AUD/CAD (OTC)">AUD/CAD (OTC)</option>
            <option value="USD/BDT (OTC)">USD/BDT (OTC)</option>
            <option value="USD/PKR (OTC)">USD/PKR (OTC)</option>
            <option value="USD/INR (OTC)">USD/INR (OTC)</option>
            <option value="USD/EGP (OTC)">USD/EGP (OTC)</option>
            <option value="USD/TRY (OTC)">USD/TRY (OTC)</option>
            <option value="USD/BRL (OTC)">USD/BRL (OTC)</option>
            <option value="NZD/USD (OTC)">NZD/USD (OTC)</option>
            <option value="USD/CHF (OTC)">USD/CHF (OTC)</option>
          </optgroup>
          <optgroup label="Standard Market Pairs">
            <option value="EUR/USD">EUR/USD</option>
            <option value="GBP/USD">GBP/USD</option>
            <option value="USD/JPY">USD/JPY</option>
            <option value="BTC/USD">BTC/USD</option>
            <option value="ETH/USD">ETH/USD</option>
          </optgroup>
        </select>
      </div>

      <div class="control-group">
        <label for="tf-select">Time Frame</label>
        <select id="tf-select" class="custom-select">
          <!-- Expanded Timeframes: 3s to 1 Hour -->
          <option value="3s">3 sec</option>
          <option value="5s">5 sec</option>
          <option value="7s">7 sec</option>
          <option value="9s">9 sec</option>
          <option value="12s">12 sec</option>
          <option value="15s">15 sec</option>
          <option value="18s">18 sec</option>
          <option value="21s">21 sec</option>
          <option value="24s">24 sec</option>
          <option value="27s">27 sec</option>
          <option value="30s">30 sec</option>
          <option value="45s">45 sec</option>
          <option value="1m">1 min</option>
          <option value="2m">2 min</option>
          <option value="3m">3 min</option>
          <option value="5m">5 min</option>
          <option value="10m">10 min</option>
          <option value="15m">15 min</option>
          <option value="30m">30 min</option>
          <option value="1h">1 hour</option>
        </select>
      </div>
    </div>

    <!-- AI Signal Engine Display -->
    <div class="engine-display">
      <div id="engine-text" class="engine-status">STANDBY</div>
      <div id="engine-subtext" class="engine-subtext">Engine Ready &bull; Server Arsii-74 Connected</div>
    </div>

    <!-- Active Signal Alert Box -->
    <div id="signal-box" class="signal-box"></div>

    <!-- Start Bot Action Button -->
    <button id="start-btn" class="btn-primary" onclick="toggleBot()">START BOT</button>

    <!-- Market Details Footer -->
    <div class="market-ticker">
      <span>Market Status: <strong style="color: #4ade80;">SYNCHRONIZED</strong></span>
      <span>Live Rate: <span id="live-price" class="price-value">1.08452</span></span>
    </div>
  </div>

  <script>
    let isRunning = false;
    let signalInterval = null;
    let priceInterval = null;
    let currentPrice = 1.08452;

    // Simulate Live Price Fluctuations matching Pocket Option Market
    priceInterval = setInterval(() => {
      const change = (Math.random() - 0.5) * 0.00030;
      currentPrice = Math.max(0.00001, currentPrice + change);
      document.getElementById('live-price').innerText = currentPrice.toFixed(5);
    }, 1000);

    function toggleBot() {
      const btn = document.getElementById('start-btn');
      const engineText = document.getElementById('engine-text');
      const engineSubtext = document.getElementById('engine-subtext');
      const signalBox = document.getElementById('signal-box');

      if (!isRunning) {
        isRunning = true;
        btn.innerText = "STOP BOT";
        btn.style.background = "linear-gradient(135deg, #ef4444, #dc2626)";
        btn.style.color = "#ffffff";
        
        engineText.innerText = "ANALYZING MARKET...";
        engineSubtext.innerText = "Scanning Pocket Option chart patterns...";

        // Initial delay before first signal, then cycle every 5 seconds
        setTimeout(() => {
          if (isRunning) {
            generateSignal();
            signalInterval = setInterval(generateSignal, 5000);
          }
        }, 1500);

      } else {
        isRunning = false;
        clearInterval(signalInterval);
        btn.innerText = "START BOT";
        btn.style.background = "linear-gradient(135deg, var(--primary-orange), #f58220)";
        btn.style.color = "#1c130b";
        
        engineText.innerText = "STANDBY";
        engineSubtext.innerText = "Engine Ready • Server Arsii-74 Connected";
        signalBox.style.display = "none";
        
        // Reset full screen alert styles
        document.body.className = "";
      }
    }

    function generateSignal() {
      if (!isRunning) return;

      const pair = document.getElementById('pair-select').value;
      const tf = document.getElementById('tf-select').value;
      const signalBox = document.getElementById('signal-box');
      const engineText = document.getElementById('engine-text');
      
      // Calculate signal recommendation based on Pocket Option market trend simulation
      const isBuy = Math.random() > 0.48;
      const direction = isBuy ? "CALL (BUY) ▲" : "PUT (SELL) ▼";

      engineText.innerText = "SIGNAL ACTIVE";
      signalBox.innerText = `[${pair} - ${tf}] SIGNAL: ${direction}`;

      if (isBuy) {
        signalBox.className = "signal-box buy";
        document.body.className = "signal-buy-active";
      } else {
        signalBox.className = "signal-box sell";
        document.body.className = "signal-sell-active";
      }
    }
  </script>
</body>
</html>
