<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#020711">

<title>SEEKER BOT V5.1</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#020711;
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:560px;
    margin:auto;
    min-height:100vh;
    padding:18px 14px 30px;
}

.header{
    text-align:center;
    margin-bottom:18px;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
}

.subtitle{
    margin-top:5px;
    font-size:11px;
    color:#64748b;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.panel{
    background:linear-gradient(
        145deg,
        rgba(15,23,42,.96),
        rgba(2,7,17,.98)
    );
    border:1px solid rgba(71,85,105,.45);
    border-radius:20px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:
        0 15px 45px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.03);
}

.label{
    display:block;
    margin-bottom:7px;
    color:#94a3b8;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.select{
    width:100%;
    height:48px;
    padding:0 13px;
    border-radius:12px;
    border:1px solid #334155;
    background:#080f1d;
    color:#fff;
    font-size:15px;
    font-weight:700;
    outline:none;
}

.select:focus{
    border-color:#64748b;
}

.field{
    margin-bottom:14px;
}

.analyse-btn{
    width:100%;
    height:54px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:#fff;
    font-size:16px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(37,99,235,.25);
    transition:.2s;
}

.analyse-btn:active{
    transform:scale(.98);
}

.analyse-btn:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.status-title{
    color:#94a3b8;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}

.status-dot{
    display:flex;
    align-items:center;
    gap:7px;
    color:#94a3b8;
    font-size:11px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#64748b;
}

.dot.online{
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

.dot.error{
    background:#ef4444;
    box-shadow:0 0 10px #ef4444;
}

.signal-card{
    position:relative;
    min-height:230px;
    border-radius:20px;
    padding:22px 16px;
    text-align:center;
    background:#050b16;
    border:1px solid #1e293b;
    overflow:hidden;
}

.signal-card.buy{
    border-color:rgba(34,197,94,.55);
    box-shadow:
        0 0 35px rgba(34,197,94,.10),
        inset 0 0 30px rgba(34,197,94,.04);
}

.signal-card.sell{
    border-color:rgba(239,68,68,.55);
    box-shadow:
        0 0 35px rgba(239,68,68,.10),
        inset 0 0 30px rgba(239,68,68,.04);
}

.signal-card.wait{
    border-color:#334155;
}

.signal-card.error{
    border-color:rgba(239,68,68,.4);
}

.signal-label{
    color:#64748b;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:8px;
}

.signal-text{
    font-size:52px;
    line-height:1;
    font-weight:1000;
    letter-spacing:2px;
    margin:12px 0;
}

.signal-text.buy{
    color:#22c55e !important;
    text-shadow:0 0 25px rgba(34,197,94,.35);
}

.signal-text.sell{
    color:#ef4444 !important;
    text-shadow:0 0 25px rgba(239,68,68,.35);
}

.signal-text.wait{
    color:#f59e0b !important;
}

.signal-text.error{
    color:#ef4444 !important;
    font-size:34px;
}

.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:92px;
    padding:7px 14px;
    border-radius:999px;
    font-size:11px;
    font-weight:900;
    letter-spacing:1px;
    background:#111827;
    color:#94a3b8;
    border:1px solid #334155;
}

.badge.buy{
    background:rgba(34,197,94,.12);
    border-color:rgba(34,197,94,.45);
    color:#22c55e;
}

.badge.sell{
    background:rgba(239,68,68,.12);
    border-color:rgba(239,68,68,.45);
    color:#ef4444;
}

.badge.error{
    background:rgba(239,68,68,.12);
    border-color:rgba(239,68,68,.45);
    color:#ef4444;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.info-box{
    background:#080f1d;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:11px;
}

.info-title{
    color:#64748b;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:5px;
}

.info-value{
    color:#e2e8f0;
    font-size:13px;
    font-weight:800;
    word-break:break-word;
}

.confidence{
    margin-top:15px;
}

.confidence-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.confidence-title{
    color:#64748b;
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
}

.confidence-value{
    color:#e2e8f0;
    font-size:13px;
    font-weight:900;
}

.progress{
    width:100%;
    height:7px;
    border-radius:99px;
    background:#111827;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:99px;
    transition:width .4s ease;
    background:#64748b;
}

.progress-bar.buy{
    background:#22c55e;
}

.progress-bar.sell{
    background:#ef4444;
}

.message{
    display:none;
    margin-top:14px;
    padding:12px;
    border-radius:12px;
    background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
    font-size:12px;
    line-height:1.5;
}

.reason-box{
    margin-top:14px;
    text-align:left;
    background:#080f1d;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:12px;
}

.reason-title{
    color:#64748b;
    font-size:9px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:8px;
}

.reason{
    color:#cbd5e1;
    font-size:11px;
    line-height:1.5;
    padding:3px 0;
}

.footer{
    text-align:center;
    margin-top:16px;
    color:#475569;
    font-size:9px;
    line-height:1.5;
}

/* Countdown */
.countdown{
    margin-top:15px;
    font-size:11px;
    color:#64748b;
    font-weight:800;
    letter-spacing:1px;
}

.countdown span{
    color:#e2e8f0;
}

/* Mobile */
@media(max-width:380px){
    .app{
        padding-left:10px;
        padding-right:10px;
    }

    .logo{
        font-size:24px;
    }

    .signal-text{
        font-size:46px;
    }
}
</style>
</head>

<body>

<script>

/* =========================================================
   SIGNAL NORMALIZER
========================================================= */

function normalizeSignal(value){

    if(value === undefined || value === null){
        return null;
    }

    const signal = String(value)
        .trim()
        .toUpperCase();

    if(
        signal === "BUY" ||
        signal === "CALL" ||
        signal === "UP" ||
        signal === "LONG" ||
        signal === "BULLISH"
    ){
        return "BUY";
    }

    if(
        signal === "SELL" ||
        signal === "PUT" ||
        signal === "DOWN" ||
        signal === "SHORT" ||
        signal === "BEARISH"
    ){
        return "SELL";
    }

    return null;
}


/* =========================================================
   ELEMENTS
========================================================= */

const assetPair =
    document.getElementById("assetPair");

const expirationTime =
    document.getElementById("expirationTime");

const analyseButton =
    document.getElementById("analyseButton");

const signalCard =
    document.getElementById("signalCard");

const signalText =
    document.getElementById("signalText");

const signalBadge =
    document.getElementById("signalBadge");

const confidenceValue =
    document.getElementById("confidenceValue");

const confidenceBar =
    document.getElementById("confidenceBar");

const priceValue =
    document.getElementById("priceValue");

const sourceValue =
    document.getElementById("sourceValue");

const scoreValue =
    document.getElementById("scoreValue");

const assetValue =
    document.getElementById("assetValue");

const selectedTime =
    document.getElementById("selectedTime");

const errorMessage =
    document.getElementById("errorMessage");

const serverDot =
    document.getElementById("serverDot");

const serverStatus =
    document.getElementById("serverStatus");

const reasonBox =
    document.getElementById("reasonBox");

const reasonList =
    document.getElementById("reasonList");


/* =========================================================
   UPDATE SELECTED INFORMATION
========================================================= */

function updateSelection(){

    if(assetPair){
        assetValue.textContent =
            assetPair.value || "--";
    }

    if(expirationTime){
        selectedTime.textContent =
            expirationTime.value || "--";
    }
}

assetPair.addEventListener(
    "change",
    updateSelection
);

expirationTime.addEventListener(
    "change",
    updateSelection
);

updateSelection();


/* =========================================================
   SIGNAL COLOR
   BUY = GREEN
   SELL = RED
========================================================= */

function applySignal(signal){

    signalCard.classList.remove(
        "buy",
        "sell",
        "wait",
        "error"
    );

    signalText.classList.remove(
        "buy",
        "sell",
        "wait",
        "error"
    );

    signalBadge.classList.remove(
        "buy",
        "sell",
        "error"
    );

    confidenceBar.classList.remove(
        "buy",
        "sell"
    );

    if(signal === "BUY"){

        signalCard.classList.add("buy");

        signalText.classList.add("buy");

        signalBadge.classList.add("buy");

        confidenceBar.classList.add("buy");

        signalText.textContent = "BUY";

        signalBadge.textContent = "BUY";

    }
    else if(signal === "SELL"){

        signalCard.classList.add("sell");

        signalText.classList.add("sell");

        signalBadge.classList.add("sell");

        confidenceBar.classList.add("sell");

        signalText.textContent = "SELL";

        signalBadge.textContent = "SELL";

    }
    else{

        signalCard.classList.add("wait");

        signalText.classList.add("wait");

        signalText.textContent = "WAIT";

        signalBadge.textContent = "WAIT";
    }
}


/* =========================================================
   SERVER STATUS
========================================================= */

async function checkServer(){

    try{

        const response =
            await fetch(
                "/api/health",
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error("Server offline");
        }

        serverDot.classList.remove("error");
        serverDot.classList.add("online");

        serverStatus.textContent = "ONLINE";

    }
    catch(error){

        serverDot.classList.remove("online");
        serverDot.classList.add("error");

        serverStatus.textContent = "OFFLINE";
    }
}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    signalCard.classList.remove(
        "buy",
        "sell",
        "wait"
    );

    signalCard.classList.add("error");

    signalText.classList.remove(
        "buy",
        "sell",
        "wait"
    );

    signalText.classList.add("error");

    signalText.textContent = "ERROR";

    signalBadge.classList.remove(
        "buy",
        "sell"
    );

    signalBadge.classList.add("error");

    signalBadge.textContent = "ERROR";

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";
}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError(){

    errorMessage.textContent = "";

    errorMessage.style.display =
        "none";

    signalCard.classList.remove("error");

    signalText.classList.remove("error");

    signalBadge.classList.remove("error");
}


/* =========================================================
   REASONS
========================================================= */

function showReasons(reasons){

    if(
        !Array.isArray(reasons) ||
        reasons.length === 0
    ){

        reasonBox.style.display =
            "none";

        reasonList.innerHTML =
            "";

        return;
    }

    reasonList.innerHTML = "";

    reasons.forEach(reason => {

        const div =
            document.createElement("div");

        div.className =
            "reason";

        div.textContent =
            "• " + String(reason);

        reasonList.appendChild(div);

    });

    reasonBox.style.display =
        "block";
}


/* =========================================================
   GENERATE SIGNAL
========================================================= */

async function generateSignal(){

    clearError();

    updateSelection();

    const pair =
        assetPair.value;

    const expiration =
        expirationTime.value;

    analyseButton.disabled =
        true;

    analyseButton.textContent =
        "ANALYSING...";

    /*
       Keep selected pair/timeframe exactly as selected.
    */

    signalCard.classList.remove(
        "buy",
        "sell",
        "error"
    );

    signalCard.classList.add(
        "wait"
    );

    signalText.classList.remove(
        "buy",
        "sell",
        "error"
    );

    signalText.classList.add(
        "wait"
    );

    signalText.textContent =
        "ANALYSING";

    signalBadge.classList.remove(
        "buy",
        "sell",
        "error"
    );

    signalBadge.textContent =
        "ANALYSING";

    confidenceValue.textContent =
        "--";

    confidenceBar.style.width =
        "0%";

    priceValue.textContent =
        "--";

    sourceValue.textContent =
        "--";

    scoreValue.textContent =
        "--";

    try{

        const url =
            "/api/signal" +
            "?pair=" +
            encodeURIComponent(pair) +
            "&expiration=" +
            encodeURIComponent(expiration);

        console.log(
            "Requesting signal:",
            url
        );

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json"
                    },
                    cache:"no-store"
                }
            );

        /*
          Important:
          Do not try to parse an error page as JSON.
        */

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";

        if(!contentType.includes(
            "application/json"
        )){

            const text =
                await response.text();

            throw new Error(
                "Server did not return JSON. " +
                "Check /api/signal in server.py."
            );
        }

        const data =
            await response.json();

        console.log(
            "SIGNAL RESPONSE:",
            data
        );

        if(!response.ok){

            throw new Error(
                data.detail ||
                data.message ||
                "Signal server error"
            );
        }


        /* =========================================
           ACCEPT MULTIPLE BACKEND FIELD NAMES
        ========================================= */

        const signal =
            normalizeSignal(
                data.signal ??
                data.action ??
                data.recommendation ??
                data.direction ??
                data.side ??
                data.result
            );


        /*
          This is the important fix.

          Backend must return BUY or SELL.
          Frontend converts:
          CALL/UP/LONG -> BUY
          PUT/DOWN/SHORT -> SELL
        */

        if(!signal){

            throw new Error(
                "Server returned no valid BUY or SELL signal."
            );
        }


        /* =========================================
           FINAL SIGNAL
        ========================================= */

        applySignal(signal);


        /* =========================================
           ASSET
        ========================================= */

        assetValue.textContent =
            data.pair ||
            data.asset ||
            pair;


        /* =========================================
           PRICE
        ========================================= */

        if(
            data.price !== undefined &&
            data.price !== null
        ){

            priceValue.textContent =
                data.price;
        }
        else{

            priceValue.textContent =
                "--";
        }


        /* =========================================
           SOURCE
        ========================================= */

        sourceValue.textContent =
            data.source ||
            data.data_source ||
            "MARKET DATA";


        /* =========================================
           SCORE
        ========================================= */

        if(
            data.score !== undefined &&
            data.score !== null
        ){

            scoreValue.textContent =
                data.score;
        }
        else{

            scoreValue.textContent =
                "--";
        }


        /* =========================================
           CONFIDENCE
        ========================================= */

        let confidence =
            data.confidence ??
            data.strength ??
            data.signal_strength;

        if(
            confidence !== undefined &&
            confidence !== null &&
            !isNaN(Number(confidence))
        ){

            confidence =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Number(confidence)
                    )
                );

            confidenceValue.textContent =
                Math.round(confidence) + "%";

            confidenceBar.style.width =
                Math.round(confidence) + "%";

        }
        else{

            confidenceValue.textContent =
                "--";

            confidenceBar.style.width =
                "0%";
        }


        /* =========================================
           REASONS
        ========================================= */

        showReasons(
            data.reasons ||
            data.analysis ||
            []
        );


        /* =========================================
           ONLINE
        ========================================= */

        serverDot.classList.remove(
            "error"
        );

        serverDot.classList.add(
            "online"
        );

        serverStatus.textContent =
            "ONLINE";


        console.log(
            signal === "BUY"
                ? "🟢 BUY SIGNAL"
                : "🔴 SELL SIGNAL"
        );

    }
    catch(error){

        console.error(
            "Signal engine error:",
            error
        );

        showError(
            error.message ||
            "Signal engine error."
        );

        serverDot.classList.remove(
            "online"
        );

        serverDot.classList.add(
            "error"
        );

        serverStatus.textContent =
            "ERROR";
    }
    finally{

        analyseButton.disabled =
            false;

        analyseButton.textContent =
            "ANALYSE & GENERATE SIGNAL";
    }
}


/* =========================================================
   STARTUP
========================================================= */

checkServer();

/*
   Check server every 10 seconds.
   This does NOT automatically generate trades/signals.
*/

setInterval(
    checkServer,
    10000
);

</script>
