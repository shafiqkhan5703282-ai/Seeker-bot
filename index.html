<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Signal Engine Clone</title>
<style>
    body { background-color: #0d1321; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .bot-container { background: #172a45; width: 350px; border-radius: 20px; padding: 20px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); border: 1px solid #1f3a5f; }
    .header { text-align: center; font-weight: bold; color: #00e5ff; margin-bottom: 20px; font-size: 1.2em; }
    .radar-circle { width: 150px; height: 150px; border: 4px solid #00e5ff; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
    .radar-circle h2 { margin: 0; font-size: 2em; }
    .radar-circle span { font-size: 0.8em; color: #a0aec0; }
    .controls { display: flex; justify-content: space-between; margin-top: 20px; font-size: 0.9em; }
    .btn-start { display: block; width: 100%; background: linear-gradient(90deg, #007bb5, #00e5ff); color: #fff; border: none; padding: 15px; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
    .btn-start:hover { opacity: 0.9; }
    .status-text { text-align: center; margin-top: 15px; color: #a0aec0; font-size: 0.9em; min-height: 20px; }
    .signal-box { display: none; background: #00e676; color: #000; text-align: center; padding: 15px; border-radius: 10px; margin-top: 20px; font-weight: bold; font-size: 1.5em; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="bot-container">
    <div class="header">AI SIGNAL ENGINE</div>
    <div class="radar-circle" id="radar">
        <h2>STANDBY</h2>
        <span>Awaiting Input</span>
    </div>
    
    <div class="controls">
        <div><strong>PAIR:</strong> USD/INR (OTC)</div>
        <div><strong>TIME:</strong> 15s</div>
    </div>

    <div class="status-text" id="status">Press START BOT to receive signals</div>
    
    <button class="btn-start" id="startBtn" onclick="startScan()">► START BOT</button>
    
    <div class="signal-box" id="signalBox">
        ⬆ UP (CALL)<br>
        <span style="font-size: 0.6em; color: #222;">ACCURACY: 98%</span>
    </div>
</div>

<script>
    function startScan() {
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const radar = document.getElementById('radar');
        const signalBox = document.getElementById('signalBox');
        
        btn.style.display = 'none';
        signalBox.style.display = 'none';
        radar.innerHTML = '<h2>...</h2><span>Scanning</span>';
        
        const scanSteps = [
            "Scanning candles...",
            "Analyzing RSI & MACD...",
            "Checking EMA Trends...",
            "Calculating Volatility...",
            "Calibrating high-accuracy signal..."
        ];
        
        let step = 0;
        const interval = setInterval(() => {
            if (step < scanSteps.length) {
                status.innerText = scanSteps[step];
                step++;
            } else {
                clearInterval(interval);
                status.innerText = "Signal Generated";
                radar.innerHTML = '<h2 style="color:#00e676;">98%</h2><span>Win Probability</span>';
                signalBox.style.display = 'block';
                setTimeout(() => { btn.style.display = 'block'; btn.innerText = "GENERATE NEW SIGNAL"; }, 3000);
            }
        }, 800);
    }
</script>
</body>
</html>
