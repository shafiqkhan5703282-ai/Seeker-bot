<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matrix Trade Analyzer</title>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: monospace;
            padding: 20px;
            text-align: center;
        }
        .matrix-frame {
            background-color: #0a0f0d;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .header-text {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .console-box {
            background: #000;
            border: 1px dashed #00ffcc;
            padding: 15px;
            margin: 15px 0;
            font-size: 13px;
            color: #00ffcc;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #111;
            border: 1px solid #333;
            padding: 8px;
            font-size: 11px;
            text-align: left;
        }
        .stat-card span {
            display: block;
            color: #777;
            font-size: 9px;
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-family: monospace;
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover {
            background-color: #00cc99;
        }
        .signal-alert {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="matrix-frame">
        <div class="header-text">TRADE WITH EXPERT // SYSTEM V.4</div>
        <h3 style="margin: 5px 0; color: #fff;">EXTRACTING CANDLE DATA</h3>
        
        <div class="console-box" id="console-text">
            Waiting for signal trigger...
        </div>

        <div class="grid-stats">
            <div class="stat-card">
                <span>PAIR / ASSET</span>
                EUR/CHF (OTC)
            </div>
            <div class="stat-card">
                <span>CONFIDENCE</span>
                <span id="conf-val" style="color:#00ffcc; font-size:12px;">--%</span>
            </div>
        </div>

        <button onclick="runMatrixSequence()">EXECUTE ANALYSIS</button>

        <div id="signal-box" class="signal-alert" style="display: none;"></div>
    </div>

    <script>
        function runMatrixSequence() {
            const consoleBox = document.getElementById('console-text');
            const confVal = document.getElementById('conf-val');
            const signalBox = document.getElementById('signal-box');
            
            signalBox.style.display = 'none';
            consoleBox.innerText = "Reading simulated previous candle data...";
            confVal.innerText = "Analyzing...";

            // Sequence simulation steps
            setTimeout(() => {
                consoleBox.innerText = "Locking market indicators...";
            }, 1500);

            setTimeout(() => {
                const randomConf = Math.floor(Math.random() * (95 - 82 + 1)) + 82;
                confVal.innerText = randomConf + "%";

                const choices = [
                    { text: "▲ CALL (UP)", color: "#00ffcc", bg: "rgba(0, 255, 204, 0.1)" },
                    { text: "▼ DOWN", color: "#ff3366", bg: "rgba(255, 51, 102, 0.1)" }
                ];
                const selected = choices[Math.floor(Math.random() * choices.length)];

                consoleBox.innerText = "SIGNAL LOCKED - CONFIDENCE HIGH";
                
                signalBox.style.display = 'block';
                signalBox.innerText = selected.text;
                signalBox.style.color = selected.color;
                signalBox.style.backgroundColor = selected.bg;
                signalBox.style.border = "1px solid " + selected.color;
            }, 3000);
        }
    </script>

</body>
</html>
