<script>

/*
==========================================================
 SEEKER BOT V4.1
 REAL MARKET DATA SIGNAL ENGINE
==========================================================

 IMPORTANT:

 This browser engine does NOT generate random signals.

 For crypto pairs it can use Binance public candles.

 For forex/commodities, configure a compatible market-data
 endpoint in MARKET_DATA_ENDPOINT below.

 Expected endpoint response:

 {
   "candles": [
     {
       "time": 1234567890,
       "open": 1.1000,
       "high": 1.1020,
       "low": 1.0990,
       "close": 1.1010,
       "volume": 1000
     }
   ]
 }

 The engine intentionally returns WAIT when reliable data
 is unavailable or confirmations disagree.

==========================================================
*/


/* -------------------------------------------------------
   CONFIGURATION
------------------------------------------------------- */

const CONFIG = {

  /*
   Example:

   https://your-server.com/api/market

   Your server should receive:

   ?symbol=EUR/USD&interval=1m&limit=150

   and return:

   {
      "candles":[...]
   }
  */

  MARKET_DATA_ENDPOINT: "",

  /*
   Binance public API works without an API key for crypto.
  */

  BINANCE_ENDPOINT:
    "https://api.binance.com/api/v3/klines",

  CANDLE_LIMIT: 150,

  MIN_CANDLES: 60,

  MIN_CONFIRMATION: 72,

  STRONG_CONFIRMATION: 82,

  REQUEST_TIMEOUT: 8000

};


/* -------------------------------------------------------
   STATE
------------------------------------------------------- */

let currentAnalysis = null;
let isAnalyzing = false;


/* -------------------------------------------------------
   ELEMENT HELPERS
------------------------------------------------------- */

function $(id) {
  return document.getElementById(id);
}


function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}


/* -------------------------------------------------------
   PAIR DETECTION
------------------------------------------------------- */

function isCryptoPair(pair) {

  const cryptoPairs = [

    "BTC/USD",
    "ETH/USD",
    "BNB/USD",
    "SOL/USD",
    "XRP/USD",
    "ADA/USD",
    "DOGE/USD",
    "AVAX/USD",
    "LINK/USD",
    "DOT/USD"

  ];

  return cryptoPairs.includes(pair);

}


function cryptoSymbol(pair) {

  const map = {

    "BTC/USD": "BTCUSDT",
    "ETH/USD": "ETHUSDT",
    "BNB/USD": "BNBUSDT",
    "SOL/USD": "SOLUSDT",
    "XRP/USD": "XRPUSDT",
    "ADA/USD": "ADAUSDT",
    "DOGE/USD": "DOGEUSDT",
    "AVAX/USD": "AVAXUSDT",
    "LINK/USD": "LINKUSDT",
    "DOT/USD": "DOTUSDT"

  };

  return map[pair] || null;

}


/* -------------------------------------------------------
   TIMEFRAME
------------------------------------------------------- */

function getCandleInterval() {

  const exp = $("expirationTime").value;

  if (
    exp.includes("SECONDS") ||
    exp === "1 MINUTE" ||
    exp === "2 MINUTES"
  ) {
    return "1m";
  }

  if (
    exp === "3 MINUTES" ||
    exp === "5 MINUTES"
  ) {
    return "5m";
  }

  if (
    exp === "15 MINUTES"
  ) {
    return "15m";
  }

  if (
    exp === "30 MINUTES"
  ) {
    return "30m";
  }

  if (
    exp === "1 HOUR"
  ) {
    return "1h";
  }

  return "1m";

}


/* -------------------------------------------------------
   FETCH WITH TIMEOUT
------------------------------------------------------- */

async function fetchWithTimeout(url, options = {}) {

  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    CONFIG.REQUEST_TIMEOUT
  );

  try {

    return await fetch(url, {
      ...options,
      signal: controller.signal
    });

  } finally {

    clearTimeout(timeout);

  }

}


/* -------------------------------------------------------
   BINANCE MARKET DATA
------------------------------------------------------- */

async function fetchBinanceCandles(symbol, interval) {

  const url =
    CONFIG.BINANCE_ENDPOINT +
    "?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=" +
    encodeURIComponent(interval) +
    "&limit=" +
    CONFIG.CANDLE_LIMIT;

  const response =
    await fetchWithTimeout(url);

  if (!response.ok) {

    throw new Error(
      "Binance returned HTTP " + response.status
    );

  }

  const data = await response.json();

  if (!Array.isArray(data)) {

    throw new Error("Invalid Binance candle response");

  }

  return data.map(k => ({

    time: Number(k[0]),

    open: Number(k[1]),

    high: Number(k[2]),

    low: Number(k[3]),

    close: Number(k[4]),

    volume: Number(k[5])

  }));

}


/* -------------------------------------------------------
   GENERIC MARKET DATA
------------------------------------------------------- */

async function fetchGenericMarketData(pair, interval) {

  if (!CONFIG.MARKET_DATA_ENDPOINT) {

    throw new Error(
      "No live forex/commodity data endpoint configured"
    );

  }

  const url =
    CONFIG.MARKET_DATA_ENDPOINT +
    "?symbol=" +
    encodeURIComponent(pair) +
    "&interval=" +
    encodeURIComponent(interval) +
    "&limit=" +
    CONFIG.CANDLE_LIMIT;

  const response =
    await fetchWithTimeout(url);

  if (!response.ok) {

    throw new Error(
      "Market server returned HTTP " +
      response.status
    );

  }

  const data = await response.json();

  if (!data || !Array.isArray(data.candles)) {

    throw new Error(
      "Invalid market-data response"
    );

  }

  return data.candles.map(c => ({

    time: Number(c.time),

    open: Number(c.open),

    high: Number(c.high),

    low: Number(c.low),

    close: Number(c.close),

    volume: Number(c.volume || 0)

  }));

}


/* -------------------------------------------------------
   GET MARKET DATA
------------------------------------------------------- */

async function getMarketData(pair, interval) {

  if (isCryptoPair(pair)) {

    const symbol = cryptoSymbol(pair);

    return await fetchBinanceCandles(
      symbol,
      interval
    );

  }

  /*
   Remove "(OTC)" before sending the pair to a
   generic market-data server.

   Example:

   EUR/USD (OTC)

   becomes:

   EUR/USD
  */

  const cleanPair =
    pair.replace(" (OTC)", "");

  return await fetchGenericMarketData(
    cleanPair,
    interval
  );

}


/* -------------------------------------------------------
   EMA
------------------------------------------------------- */

function calculateEMA(values, period) {

  if (values.length < period) {
    return null;
  }

  const multiplier =
    2 / (period + 1);

  let ema = 0;

  for (let i = 0; i < period; i++) {

    ema += values[i];

  }

  ema /= period;

  for (let i = period; i < values.length; i++) {

    ema =
      (values[i] - ema) *
      multiplier +
      ema;

  }

  return ema;

}


/* -------------------------------------------------------
   RSI
------------------------------------------------------- */

function calculateRSI(values, period = 14) {

  if (values.length <= period) {
    return null;
  }

  let gains = 0;
  let losses = 0;

  for (let i = 1; i <= period; i++) {

    const difference =
      values[i] - values[i - 1];

    if (difference >= 0) {

      gains += difference;

    } else {

      losses += Math.abs(difference);

    }

  }

  let averageGain =
    gains / period;

  let averageLoss =
    losses / period;

  for (
    let i = period + 1;
    i < values.length;
    i++
  ) {

    const difference =
      values[i] - values[i - 1];

    const gain =
      Math.max(difference, 0);

    const loss =
      Math.max(-difference, 0);

    averageGain =
      ((averageGain * (period - 1)) + gain) /
      period;

    averageLoss =
      ((averageLoss * (period - 1)) + loss) /
      period;

  }

  if (averageLoss === 0) {
    return 100;
  }

  const rs =
    averageGain / averageLoss;

  return 100 - (100 / (1 + rs));

}


/* -------------------------------------------------------
   MACD
------------------------------------------------------- */

function calculateMACD(values) {

  if (values.length < 35) {
    return null;
  }

  const ema12 = calculateEMA(values, 12);

  const ema26 = calculateEMA(values, 26);

  if (
    ema12 === null ||
    ema26 === null
  ) {
    return null;
  }

  /*
   For the current candle we calculate
   the fast/slow relationship.

   This is used as a confirmation rather
   than as a standalone signal.
  */

  const macd =
    ema12 - ema26;

  return {
    value: macd,
    bullish: macd > 0,
    bearish: macd < 0
  };

}


/* -------------------------------------------------------
   PRICE MOMENTUM
------------------------------------------------------- */

function calculateMomentum(candles) {

  if (candles.length < 10) {
    return null;
  }

  const current =
    candles[candles.length - 1].close;

  const previous =
    candles[candles.length - 6].close;

  if (previous === 0) {
    return null;
  }

  const percentage =
    ((current - previous) /
      previous) * 100;

  return {

    percentage,

    bullish: percentage > 0,

    bearish: percentage < 0

  };

}


/* -------------------------------------------------------
   CANDLE MOMENTUM
------------------------------------------------------- */

function candleDirection(candle) {

  if (!candle) {
    return "NEUTRAL";
  }

  if (candle.close > candle.open) {
    return "BULLISH";
  }

  if (candle.close < candle.open) {
    return "BEARISH";
  }

  return "NEUTRAL";

}


/* -------------------------------------------------------
   ANALYSIS ENGINE
------------------------------------------------------- */

function analyzeMarket(candles) {

  if (
    !Array.isArray(candles) ||
    candles.length < CONFIG.MIN_CANDLES
  ) {

    return {

      type: "WAIT",

      confirmation: 0,

      reason:
        "Insufficient market candles",

      price: null,

      ema: null,

      rsi: null,

      macd: null,

      momentum: null

    };

  }


  const closes =
    candles.map(c => c.close);


  const current =
    closes[closes.length - 1];


  const ema20 =
    calculateEMA(closes, 20);

  const ema50 =
    calculateEMA(closes, 50);

  const rsi =
    calculateRSI(closes, 14);

  const macd =
    calculateMACD(closes);

  const momentum =
    calculateMomentum(candles);

  const lastCandle =
    candles[candles.length - 1];


  if (
    ema20 === null ||
    ema50 === null ||
    rsi === null ||
    macd === null ||
    momentum === null
  ) {

    return {

      type: "WAIT",

      confirmation: 0,

      reason:
        "Indicators unavailable",

      price: current,

      ema: null,

      rsi: rsi,

      macd: macd,

      momentum: momentum

    };

  }


  let bullishPoints = 0;

  let bearishPoints = 0;


  /*
   EMA TREND
  */

  if (
    current > ema20 &&
    ema20 > ema50
  ) {

    bullishPoints += 25;

  }

  if (
    current < ema20 &&
    ema20 < ema50
  ) {

    bearishPoints += 25;

  }


  /*
   RSI

   Avoid buying an extremely overbought market
   and avoid selling an extremely oversold market.
  */

  if (
    rsi >= 50 &&
    rsi <= 68
  ) {

    bullishPoints += 20;

  }

  if (
    rsi <= 50 &&
    rsi >= 32
  ) {

    bearishPoints += 20;

  }


  /*
   MACD
  */

  if (macd.bullish) {

    bullishPoints += 20;

  }

  if (macd.bearish) {

    bearishPoints += 20;

  }


  /*
   PRICE MOMENTUM
  */

  if (momentum.bullish) {

    bullishPoints += 20;

  }

  if (momentum.bearish) {

    bearishPoints += 20;

  }


  /*
   LAST CANDLE
  */

  const direction =
    candleDirection(lastCandle);


  if (direction === "BULLISH") {

    bullishPoints += 15;

  }

  if (direction === "BEARISH") {

    bearishPoints += 15;

  }


  const totalPossible = 100;

  const bullishConfirmation =
    Math.min(
      bullishPoints,
      totalPossible
    );

  const bearishConfirmation =
    Math.min(
      bearishPoints,
      totalPossible
    );


  let type = "WAIT";

  let confirmation =
    Math.max(
      bullishConfirmation,
      bearishConfirmation
    );


  /*
   Require a meaningful difference between
   bullish and bearish confirmation.

   This prevents the bot from forcing a trade
   when indicators disagree.
  */

  const difference =
    Math.abs(
      bullishConfirmation -
      bearishConfirmation
    );


  if (
    bullishConfirmation >=
      CONFIG.MIN_CONFIRMATION &&
    bullishConfirmation >
      bearishConfirmation &&
    difference >= 15
  ) {

    type = "CALL";

  } else if (
    bearishConfirmation >=
      CONFIG.MIN_CONFIRMATION &&
    bearishConfirmation >
      bullishConfirmation &&
    difference >= 15
  ) {

    type = "PUT";

  } else {

    type = "WAIT";

  }


  return {

    type,

    confirmation,

    price: current,

    ema: {

      ema20,

      ema50,

      bullish:
        current > ema20 &&
        ema20 > ema50,

      bearish:
        current < ema20 &&
        ema20 < ema50

    },

    rsi,

    macd,

    momentum,

    candle:
      direction,

    bullishPoints,

    bearishPoints,

    reason:
      type === "WAIT"
        ? "Indicators are not sufficiently aligned"
        : "Multiple indicators confirm direction"

  };

}


/* -------------------------------------------------------
   STEP UI
------------------------------------------------------- */

function resetSteps() {

  [
    "step1",
    "step2",
    "step3"
  ].forEach(id => {

    const el = $(id);

    el.className =
      "flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-800 text-gray-400";

    el.querySelector(
      ".status-icon"
    ).innerText = "⏳";

  });

}


function setStepComplete(id) {

  const el = $(id);

  el.className =
    "flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-orange-500/50 text-orange-400";

  el.querySelector(
    ".status-icon"
  ).innerText = "✓";

}


/* -------------------------------------------------------
   MAIN SIGNAL
------------------------------------------------------- */

async function getSignal() {

  if (isAnalyzing) {
    return;
  }

  isAnalyzing = true;

  const button =
    $("signalButton");

  button.classList.add(
    "disabled-button"
  );

  button.innerText =
    "ANALYZING MARKET...";


  $("signalState")
    .classList.add("hidden");

  $("analyzingState")
    .classList.remove("hidden");


  resetSteps();


  const pair =
    $("assetPair").value;

  const interval =
    getCandleInterval();


  $("marketStatus").innerText =
    "Connecting to live market data...";


  try {

    /*
     STEP 1
    */

    await delay(250);

    let candles;

    try {

      candles =
        await getMarketData(
          pair,
          interval
        );

    } catch (error) {

      throw new Error(
        error.message
      );

    }


    if (
      !candles ||
      candles.length <
        CONFIG.MIN_CANDLES
    ) {

      throw new Error(
        "Not enough market candles"
      );

    }


    setStepComplete("step1");


    /*
     STEP 2
    */

    await delay(350);

    const analysis =
      analyzeMarket(candles);

    setStepComplete("step2");


    /*
     STEP 3
    */

    await delay(350);

    currentAnalysis =
      analysis;

    setStepComplete("step3");


    $("marketStatus").innerText =
      "Live data analyzed • " +
      new Date().toLocaleTimeString();


    renderSignal({

      pair,

      expiration:
        $("expirationTime").value +
        " EXPIRATION",

      ...analysis

    });


  } catch (error) {

    console.error(
      "Signal engine:",
      error
    );


    $("marketStatus").innerText =
      "Market data unavailable";


    renderWaitState(
      pair,
      error.message
    );

  }


  isAnalyzing = false;

  button.classList.remove(
    "disabled-button"
  );

  button.innerText =
    "Get Next Signal";

}


/* -------------------------------------------------------
   RENDER SIGNAL
------------------------------------------------------- */

function renderSignal(data) {

  $("analyzingState")
    .classList.add("hidden");


  const signalState =
    $("signalState");

  signalState
    .classList.remove("hidden");


  const badge =
    $("signalBadge");

  const signalType =
    $("signalType");


  $("selectedPairDisplay")
    .innerText =
    data.pair;


  $("selectedExpDisplay")
    .innerText =
    data.expiration;


  /*
   CALL
  */

  if (data.type === "CALL") {

    badge.className =
      "w-44 h-44 rounded-full flex flex-col items-center justify-center text-center p-4 pulse-glow-green bg-emerald-950/40 border-2 border-emerald-500 mb-6";

    signalType.className =
      "text-2xl font-black neon-green my-1";

    signalType.innerText =
      "BUY (CALL)";

    $("signalStrength")
      .className =
      "text-lg font-bold text-green-400";

  }


  /*
   PUT
  */

  else if (data.type === "PUT") {

    badge.className =
      "w-44 h-44 rounded-full flex flex-col items-center justify-center text-center p-4 pulse-glow-red bg-red-950/40 border-2 border-red-500 mb-6";

    signalType.className =
      "text-2xl font-black neon-red my-1";

    signalType.innerText =
      "SELL (PUT)";

    $("signalStrength")
      .className =
      "text-lg font-bold text-red-400";

  }


  /*
   WAIT
  */

  else {

    badge.className =
      "w-44 h-44 rounded-full flex flex-col items-center justify-center text-center p-4 pulse-glow-yellow bg-yellow-950/40 border-2 border-yellow-500 mb-6";

    signalType.className =
      "text-2xl font-black neon-yellow my-1";

    signalType.innerText =
      "WAIT";

    $("signalStrength")
      .className =
      "text-lg font-bold text-yellow-400";

  }


  /*
   CONFIRMATION
  */

  $("signalStrength")
    .innerText =
    Math.round(
      data.confirmation || 0
    ) + "%";


  /*
   PRICE
  */

  if (
    typeof data.price === "number"
  ) {

    $("signalAccuracy")
      .innerText =
      formatPrice(data.price);

  } else {

    $("signalAccuracy")
      .innerText =
      "--";

  }


  /*
   INDICATORS
  */

  updateIndicatorDisplay(
    data
  );

}


/* -------------------------------------------------------
   WAIT STATE
------------------------------------------------------- */

function renderWaitState(
  pair,
  reason
) {

  renderSignal({

    pair,

    expiration:
      $("expirationTime").value +
      " EXPIRATION",

    type: "WAIT",

    confirmation: 0,

    price: null,

    ema: null,

    rsi: null,

    macd: null,

    momentum: null

  });


  $("marketStatus").innerText =
    "WAIT • " + reason;

}


/* -------------------------------------------------------
   INDICATOR DISPLAY
------------------------------------------------------- */

function updateIndicatorDisplay(
  data
) {

  /*
   EMA
  */

  if (
    data.ema &&
    data.ema.bullish
  ) {

    $("emaResult")
      .innerText =
      "BULLISH";

    $("emaResult")
      .className =
      "text-green-400 font-bold";

  } else if (
    data.ema &&
    data.ema.bearish
  ) {

    $("emaResult")
      .innerText =
      "BEARISH";

    $("emaResult")
      .className =
      "text-red-400 font-bold";

  } else {

    $("emaResult")
      .innerText =
      "NEUTRAL";

    $("emaResult")
      .className =
      "text-yellow-400 font-bold";

  }


  /*
   RSI
  */

  if (
    typeof data.rsi === "number"
  ) {

    $("rsiResult")
      .innerText =
      data.rsi.toFixed(1);

    if (data.rsi > 70) {

      $("rsiResult")
        .className =
        "text-red-400 font-bold";

    } else if (
      data.rsi < 30
    ) {

      $("rsiResult")
        .className =
        "text-green-400 font-bold";

    } else {

      $("rsiResult")
        .className =
        "text-gray-300 font-bold";

    }

  } else {

    $("rsiResult")
      .innerText =
      "--";

  }


  /*
   MACD
  */

  if (
    data.macd &&
    data.macd.bullish
  ) {

    $("macdResult")
      .innerText =
      "BULLISH";

    $("macdResult")
      .className =
      "text-green-400 font-bold";

  } else if (
    data.macd &&
    data.macd.bearish
  ) {

    $("macdResult")
      .innerText =
      "BEARISH";

    $("macdResult")
      .className =
      "text-red-400 font-bold";

  } else {

    $("macdResult")
      .innerText =
      "NEUTRAL";

    $("macdResult")
      .className =
      "text-yellow-400 font-bold";

  }


  /*
   MOMENTUM
  */

  if (
    data.momentum &&
    data.momentum.bullish
  ) {

    $("momentumResult")
      .innerText =
      "+" +
      data.momentum.percentage.toFixed(3) +
      "%";

    $("momentumResult")
      .className =
      "text-green-400 font-bold";

  } else if (
    data.momentum &&
    data.momentum.bearish
  ) {

    $("momentumResult")
      .innerText =
      data.momentum.percentage.toFixed(3) +
      "%";

    $("momentumResult")
      .className =
      "text-red-400 font-bold";

  } else {

    $("momentumResult")
      .innerText =
      "NEUTRAL";

    $("momentumResult")
      .className =
      "text-yellow-400 font-bold";

  }

}


/* -------------------------------------------------------
   PRICE FORMAT
------------------------------------------------------- */

function formatPrice(price) {

  if (!Number.isFinite(price)) {
    return "--";
  }

  if (price >= 1000) {

    return price.toLocaleString(
      undefined,
      {
        maximumFractionDigits: 2
      }
    );

  }

  if (price >= 1) {

    return price.toFixed(5);

  }

  return price.toFixed(8);

}

    $("marketStatus").innerText =

  }
);

</script>
